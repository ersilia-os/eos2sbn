Title: Chemical Checker Signaturizer 3D A1-5
Description: Produces bioactivity descriptors for the chemistry level of the Chemical
  Checker, covering its five A spaces from 2D and 3D structure through scaffolds and
  physicochemical character. Comajuncosa-Creus and colleagues examined more than a
  million compounds and found that around 40% of spatial isomer pairs differ measurably
  in bioactivity, motivating signaturizers trained on three-dimensional rather than
  flat representations. Descriptors are inferred by neural networks, so they estimate
  where a compound would sit had it been assayed.
